name: Feedback
description: Share your feedback, suggestions, or feature requests
title: "[Feedback]: "
labels: ["feedback", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your feedback! We'd love to hear your thoughts, suggestions, or feature ideas.
  - type: dropdown
    id: type
    attributes:
      label: Type of Feedback
      description: What type of feedback are you providing?
      options:
        - Feature Request
        - Improvement Suggestion
        - General Feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Your Feedback
      description: Please describe your feedback, suggestion, or feature request.
      placeholder: Tell us what you think...
    validations:
      required: true

