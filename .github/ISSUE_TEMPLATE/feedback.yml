name: Feedback
description: Share your feedback, suggestions, or feature requests
title: "[Feedback]: "
labels: ["feedback", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your feedback! We'd love to hear your thoughts, suggestions, or feature ideas.
  - type: dropdown
    id: type
    attributes:
      label: Type of Feedback
      description: What type of feedback are you providing?
      options:
        - Feature Request
        - Improvement Suggestion
        - General Feedback
        - UI/UX Feedback
        - Performance Feedback
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feedback Description
      description: Please describe your feedback in detail.
      placeholder: Tell us what you think...
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would this feature or improvement help you?
      placeholder: Describe how this would be useful for you...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Describe any alternatives you've thought about...
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this to you?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples here.
      placeholder: Any additional information that might be helpful...

